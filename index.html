<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MirrorCast Receiver</title>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

    <style>
      body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
      }

      cast-media-player {
        position: fixed;
        inset: 0;
        --theme-hue: 210;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.35);
      }

      .wrap {
        max-width: 900px;
        padding: 24px;
      }

      h1 {
        font-size: 42px;
        margin-bottom: 16px;
      }

      p {
        font-size: 28px;
        margin: 12px 0;
      }
    </style>
  </head>

  <body>
    <cast-media-player></cast-media-player>

    <div class="overlay">
      <div class="wrap">
        <h1>MirrorCast Custom Receiver</h1>
        <p id="status">Initialisation...</p>
        <p id="message">Aucun message reçu</p>
      </div>
    </div>

    <script>
      const CUSTOM_NAMESPACE = "urn:x-cast:com.mirrorcast.debug";

      const status = document.getElementById("status");
      const message = document.getElementById("message");

      const context = cast.framework.CastReceiverContext.getInstance();
      const playerManager = context.getPlayerManager();

      async function loadHlsStream(session) {
        const mediaInfo = new cast.framework.messages.MediaInformation();
        mediaInfo.contentUrl = session.streamURL;
        mediaInfo.contentType = "application/x-mpegURL";

        const loadRequest = new cast.framework.messages.LoadRequestData();
        loadRequest.media = mediaInfo;
        loadRequest.autoplay = true;

        await playerManager.load(loadRequest);
      }

      async function handleManagementMessage(data) {
        switch (data.type) {
          case "start_stream":
            message.textContent = "Chargement de " + data.url;

            try {
              const response = await fetch(data.url);
              const session = await response.json();

              if (session.status === "ready") {
                message.textContent =
                  "Session prête : " + session.streamURL +
                  " | codec: " + session.videoCodec +
                  " | transport: " + session.transport;

                try {
                  await loadHlsStream(session);
                  status.textContent = "Chargement média demandé";
                } catch (error) {
                  status.textContent = "Erreur load player";
                  message.textContent = "Erreur player : " + error.message;
                }
              } else {
                message.textContent =
                  "Erreur session : " + (session.message ?? "unknown_error");
              }
            } catch (error) {
              message.textContent = "Erreur fetch : " + error.message;
            }
            break;

          case "debug":
            message.textContent = "Message reçu : " + data.message;
            break;

          default:
            message.textContent =
              "Type de message inconnu : " + JSON.stringify(data);
        }
      }

      try {
        context.addCustomMessageListener(CUSTOM_NAMESPACE, (event) => {
          handleManagementMessage(event.data);
        });

        const options = new cast.framework.CastReceiverOptions();
        options.customNamespaces = {
          [CUSTOM_NAMESPACE]: cast.framework.system.MessageType.JSON
        };

        window.handleManagementMessage = handleManagementMessage;

        window.testStartStream = (url) => {
          handleManagementMessage({
            type: "start_stream",
            url
          });
        };

        window.testDebugMessage = (messageText) => {
          handleManagementMessage({
            type: "debug",
            message: messageText
          });
        };

        status.textContent = "Receiver prêt à démarrer";
        context.start(options);
        status.textContent = "Receiver démarré";
      } catch (error) {
        status.textContent = "Erreur JS : " + error.message;
        console.error(error);
      }
    </script>
  </body>
</html>
