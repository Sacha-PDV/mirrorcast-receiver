<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MirrorCast Receiver</title>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

    <style>
      body {
        margin: 0;
        background: #000;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      cast-media-player {
        --theme-hue: 210;
        --splash-image: none;
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: black;
      }

      .overlay {
        position: absolute;
        top: 24px;
        left: 24px;
        right: 24px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 16px;
        padding: 18px 22px;
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 28px;
      }

      p {
        margin: 6px 0;
        font-size: 18px;
        line-height: 1.35;
      }
    </style>
  </head>

  <body>
    <cast-media-player></cast-media-player>

    <div class="overlay">
      <h1>MirrorCast Receiver</h1>
      <p id="status">Initialisation...</p>
      <p id="message">Aucun message reçu</p>
    </div>

    <script>
      const CUSTOM_NAMESPACE = "urn:x-cast:com.mirrorcast.debug";

      const status = document.getElementById("status");
      const message = document.getElementById("message");

      const context = cast.framework.CastReceiverContext.getInstance();
      const playerManager = context.getPlayerManager();

      async function loadHlsStream(session) {
        const mediaInfo = new cast.framework.messages.MediaInformation();
        mediaInfo.contentUrl = session.streamURL;
        mediaInfo.contentType = "application/vnd.apple.mpegurl";

        const loadRequest = new cast.framework.messages.LoadRequestData();
        loadRequest.media = mediaInfo;
        loadRequest.autoplay = true;

        await playerManager.load(loadRequest);
      }

      async function handleManagementMessage(data) {
        switch (data.type) {
          case "start_stream":
            status.textContent = "Chargement session...";
            message.textContent = "Lecture de " + data.url;

            try {
              const response = await fetch(data.url);
              const session = await response.json();

              if (session.status !== "ready") {
                status.textContent = "Session invalide";
                message.textContent =
                  "Erreur session : " + (session.message ?? "unknown_error");
                return;
              }

              status.textContent = "Session prête";
              message.textContent =
                "Flux : " + session.streamURL +
                " | codec: " + session.videoCodec +
                " | transport: " + session.transport;

              await loadHlsStream(session);

              status.textContent = "Lecture HLS démarrée";
              message.textContent = "Lecture de " + session.streamURL;
            } catch (error) {
              status.textContent = "Erreur receiver";
              message.textContent = "Erreur : " + error.message;
            }
            break;

          case "debug":
            status.textContent = "Message debug";
            message.textContent = "Message reçu : " + data.message;
            break;

          default:
            status.textContent = "Message inconnu";
            message.textContent =
              "Type inconnu : " + JSON.stringify(data);
        }
      }

      context.addCustomMessageListener(CUSTOM_NAMESPACE, (event) => {
        handleManagementMessage(event.data);
      });

      const options = new cast.framework.CastReceiverOptions();
      options.customNamespaces = {
        [CUSTOM_NAMESPACE]: cast.framework.system.MessageType.JSON
      };

      window.handleManagementMessage = handleManagementMessage;

      window.testStartStream = (url) => {
        handleManagementMessage({
          type: "start_stream",
          url
        });
      };

      window.testDebugMessage = (messageText) => {
        handleManagementMessage({
          type: "debug",
          message: messageText
        });
      };

      try {
        status.textContent = "Receiver prêt à démarrer";
        context.start(options);
        status.textContent = "Receiver démarré";
      } catch (error) {
        status.textContent = "Erreur JS";
        message.textContent = error.message;
        console.error(error);
      }
    </script>
  </body>
</html>
